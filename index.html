<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생기부 분석 모임 협업 보드</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Malgun Gothic', '맑은 고딕', -apple-system, sans-serif; background-color: #DCE7F2; min-height: 100vh; padding: 24px; color: #2c3e50; }

  .lock-screen { position: fixed; inset: 0; background: #DCE7F2; z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .lock-box { background: white; border-radius: 18px; padding: 40px 36px; box-shadow: 0 12px 40px rgba(70,100,140,0.18); width: 100%; max-width: 380px; text-align: center; }
  .lock-box .lock-icon { font-size: 40px; margin-bottom: 14px; }
  .lock-box h2 { font-size: 19px; color: #34495e; margin-bottom: 8px; }
  .lock-box p { font-size: 13px; color: #6c7a89; margin-bottom: 22px; line-height: 1.5; }
  .lock-box input { width: 100%; padding: 12px 14px; border: 1px solid #d0dae6; border-radius: 10px; font-size: 15px; text-align: center; background: #f7fafd; margin-bottom: 12px; }
  .lock-box input:focus { outline: none; border-color: #5a8bbf; background: white; }
  .lock-box button { width: 100%; padding: 12px; background: #5a8bbf; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .lock-box button:hover { background: #4a7aae; }
  .lock-error { color: #c0392b; font-size: 13px; margin-top: 10px; min-height: 18px; }

  .conn-status { position: fixed; bottom: 16px; right: 16px; background: white; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; box-shadow: 0 2px 10px rgba(70,100,140,0.15); z-index: 500; display: flex; align-items: center; gap: 6px; }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #aaa; }
  .conn-dot.online { background: #4caf50; }
  .conn-dot.offline { background: #e57373; }

  header { max-width: 1600px; margin: 0 auto 16px; background: rgba(255,255,255,0.7); backdrop-filter: blur(8px); border-radius: 16px; padding: 18px 26px; box-shadow: 0 2px 12px rgba(70,100,140,0.08); }
  h1 { font-size: 21px; color: #34495e; margin-bottom: 6px; font-weight: 700; }
  .subtitle { font-size: 13px; color: #6c7a89; line-height: 1.5; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: 11px; color: rgba(0,0,0,0.55); }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  .student-tabs { max-width: 1600px; margin: 0 auto 18px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .student-tab { padding: 9px 18px; border-radius: 12px 12px 0 0; border: none; background: rgba(255,255,255,0.55); color: #5a6b7a; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 8px; }
  .student-tab:hover { background: rgba(255,255,255,0.85); }
  .student-tab.active { background: white; color: #34495e; box-shadow: 0 -2px 8px rgba(70,100,140,0.1); }
  .student-tab .tab-del { font-size: 12px; color: rgba(0,0,0,0.35); padding: 0 2px; border-radius: 4px; }
  .student-tab .tab-del:hover { color: #c0392b; background: rgba(0,0,0,0.06); }
  .add-student-btn { padding: 9px 16px; border-radius: 10px; border: 1.5px dashed rgba(90,139,191,0.5); background: rgba(255,255,255,0.5); color: #5a8bbf; font-size: 14px; font-weight: 600; cursor: pointer; }
  .add-student-btn:hover { background: white; border-style: solid; }

  .toolbar { max-width: 1600px; margin: 0 auto 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .btn { padding: 10px 18px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; background: white; color: #34495e; box-shadow: 0 2px 6px rgba(70,100,140,0.1); }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(70,100,140,0.15); }
  .btn-primary { background: #5a8bbf; color: white; }
  .btn-primary:hover { background: #4a7aae; }
  .filter-section { margin-left: auto; display: flex; gap: 8px; align-items: center; background: white; padding: 6px 12px; border-radius: 10px; box-shadow: 0 2px 6px rgba(70,100,140,0.1); }
  .filter-section label { font-size: 13px; color: #6c7a89; font-weight: 600; }
  .filter-section select { border: none; background: transparent; font-size: 14px; color: #34495e; cursor: pointer; padding: 4px 8px; font-weight: 600; }

  .board { max-width: 1600px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 22px; align-items: start; }
  .memo-group { background: rgba(255,255,255,0.32); border-radius: 16px; padding: 14px; border: 1px solid rgba(255,255,255,0.6); }

  /* 큰 포스트잇 (메모) */
  .memo { border-radius: 12px; padding: 18px; box-shadow: 0 6px 18px rgba(70,100,140,0.18); word-break: break-word; min-height: 150px; margin-bottom: 12px; }
  .memo-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
  .memo-meta { font-size: 12px; color: rgba(0,0,0,0.55); }
  .memo-author { font-weight: 700; color: rgba(0,0,0,0.78); }
  .memo-time { color: rgba(0,0,0,0.45); }
  .cat-badge { display: inline-block; background: rgba(0,0,0,0.12); color: rgba(0,0,0,0.78); padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; margin-bottom: 10px; }
  .memo-content { font-size: 14px; line-height: 1.6; color: rgba(0,0,0,0.85); white-space: pre-wrap; }
  .memo-image, .comment-image { margin-top: 10px; }
  .memo-image img, .comment-image img { max-width: 100%; border-radius: 8px; cursor: pointer; display: block; box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
  .pdf-attach { margin-top: 10px; }
  .pdf-link { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.85); border: 1px solid rgba(0,0,0,0.15); border-radius: 8px; padding: 7px 12px; font-size: 12px; font-weight: 600; color: #c0392b; text-decoration: none; cursor: pointer; }
  .pdf-link:hover { background: white; border-color: rgba(0,0,0,0.3); }
  .pdf-preview-name { font-size: 11px; color: rgba(0,0,0,0.6); background: rgba(255,255,255,0.7); border-radius: 6px; padding: 4px 8px; display: inline-flex; align-items: center; gap: 6px; }
  .pdf-remove { background: #c0392b; color: white; border: none; border-radius: 50%; width: 16px; height: 16px; font-size: 10px; cursor: pointer; line-height: 1; }

  /* 댓글 포스트잇 */
  .comments-wrap { position: relative; padding-left: 18px; }
  .comments-wrap::before { content: ''; position: absolute; left: 6px; top: -8px; bottom: 18px; width: 2px; background: rgba(90,139,191,0.35); border-radius: 1px; }
  .comments-wrap > .comment { position: relative; }
  .comments-wrap > .comment::before { content: ''; position: absolute; left: -12px; top: 20px; width: 12px; height: 2px; background: rgba(90,139,191,0.35); }
  .comment { border-radius: 12px; padding: 12px 14px; box-shadow: 0 4px 12px rgba(70,100,140,0.13); word-break: break-word; margin-bottom: 10px; font-size: 13px; }
  .comment.reply { position: relative; }
  .comment.reply::before { content: ''; position: absolute; left: -16px; top: -10px; width: 12px; height: 22px; border-left: 2px dashed rgba(90,139,191,0.4); border-bottom: 2px dashed rgba(90,139,191,0.4); border-bottom-left-radius: 8px; }
  .comment-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 8px; }
  .comment-meta { font-size: 11px; color: rgba(0,0,0,0.55); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .comment-author { font-weight: 700; color: rgba(0,0,0,0.78); }
  .comment-time { color: rgba(0,0,0,0.45); }
  .tag-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 8px; color: white; white-space: nowrap; }
  .tag-question { background: #c4a47d; }
  .tag-interpret { background: #9b87b8; }
  .tag-suggest { background: #7d9fc4; }
  .tag-concern { background: #c47d8a; }
  .tag-agree { background: #87b896; }
  .comment-content { color: rgba(0,0,0,0.85); white-space: pre-wrap; line-height: 1.55; }
  .actions { display: flex; gap: 2px; }
  .icon-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: rgba(0,0,0,0.4); padding: 2px 5px; line-height: 1; border-radius: 4px; }
  .icon-btn:hover { color: rgba(0,0,0,0.85); background: rgba(0,0,0,0.08); }

  .reply-btn { background: rgba(90,139,191,0.12); border: 1px solid rgba(90,139,191,0.4); cursor: pointer; font-size: 11px; color: #4a7aae; padding: 5px 12px; font-weight: 700; border-radius: 8px; transition: all 0.15s; margin-top: 6px; }
  .reply-btn:hover { background: #5a8bbf; color: white; border-color: #5a8bbf; }
  .add-comment-btn { width: 100%; background: rgba(255,255,255,0.55); border: 1.5px dashed rgba(90,139,191,0.5); border-radius: 10px; padding: 10px; cursor: pointer; color: #5a8bbf; font-size: 13px; font-weight: 600; transition: all 0.15s; }
  .add-comment-btn:hover { background: rgba(255,255,255,0.85); border-color: #5a8bbf; border-style: solid; }

  /* 댓글 작성 폼 */
  .comment-form { background: rgba(255,255,255,0.7); border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: 0 4px 12px rgba(70,100,140,0.15); border: 2px solid rgba(90,139,191,0.4); }
  .comment-form.reply-form { }
  .form-row-top { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
  .author-input { flex: 1; min-width: 100px; border: 1px solid rgba(0,0,0,0.15); background: white; padding: 5px 8px; border-radius: 6px; font-size: 12px; font-family: inherit; }
  .tag-selector { display: flex; gap: 3px; flex-wrap: wrap; }
  .tag-btn { border: 1.5px solid transparent; background: rgba(255,255,255,0.85); padding: 3px 8px; border-radius: 8px; font-size: 10px; font-weight: 700; cursor: pointer; color: rgba(0,0,0,0.6); transition: all 0.15s; }
  .tag-btn:hover { border-color: rgba(0,0,0,0.3); }
  .tag-btn.active { color: white; }
  .tag-btn.active[data-tag="question"] { background: #c4a47d; border-color: #c4a47d; }
  .tag-btn.active[data-tag="interpret"] { background: #9b87b8; border-color: #9b87b8; }
  .tag-btn.active[data-tag="suggest"] { background: #7d9fc4; border-color: #7d9fc4; }
  .comment-form textarea { width: 100%; border: 1px solid rgba(0,0,0,0.15); background: white; padding: 8px 10px; border-radius: 6px; font-size: 13px; font-family: inherit; resize: vertical; min-height: 60px; line-height: 1.55; }
  .comment-form textarea:focus, .comment-form input:focus { outline: none; border-color: rgba(90,139,191,0.6); }
  .img-attach-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .img-attach-btn { background: rgba(255,255,255,0.85); border: 1px solid rgba(0,0,0,0.15); border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 600; cursor: pointer; color: rgba(0,0,0,0.65); }
  .img-attach-btn:hover { background: white; border-color: rgba(0,0,0,0.3); }
  .img-preview-wrap { position: relative; display: inline-block; }
  .img-preview-wrap img { max-height: 60px; border-radius: 6px; display: block; }
  .img-remove-btn { position: absolute; top: -7px; right: -7px; background: #c0392b; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; line-height: 1; }
  .form-row-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .form-hint { font-size: 10px; color: rgba(0,0,0,0.5); }
  .form-buttons { display: flex; gap: 4px; }
  .submit-btn { background: #5a8bbf; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .submit-btn:hover { background: #4a7aae; }
  .cancel-btn { background: transparent; color: rgba(0,0,0,0.55); border: none; padding: 6px 10px; cursor: pointer; font-size: 11px; font-weight: 600; }

  /* 메모 작성 모달 */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(40,60,90,0.4); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.active { display: flex; }
  .modal { background: white; border-radius: 16px; padding: 28px; width: 100%; max-width: 520px; box-shadow: 0 12px 40px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-size: 18px; margin-bottom: 18px; color: #34495e; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; color: #6c7a89; margin-bottom: 6px; font-weight: 600; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #d0dae6; border-radius: 8px; font-size: 14px; font-family: inherit; background: #f7fafd; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #5a8bbf; background: white; }
  .form-group textarea { min-height: 110px; resize: vertical; line-height: 1.6; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }

  .img-lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center; padding: 30px; cursor: zoom-out; }
  .img-lightbox.active { display: flex; }
  .img-lightbox img { max-width: 95%; max-height: 95%; border-radius: 8px; }

  .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #6c7a89; background: rgba(255,255,255,0.5); border-radius: 16px; border: 2px dashed rgba(90,139,191,0.3); }
  .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: #5a8bbf; }

  @media (max-width: 600px) {
    body { padding: 16px; }
    .board { grid-template-columns: 1fr; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .filter-section { margin-left: 0; }
  }
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <h2>생기부 분석 모임 보드</h2>
    <p>모임 선생님들께 공유된<br>비밀번호를 입력해 주세요.</p>
    <input type="password" id="passwordInput" placeholder="비밀번호">
    <button id="enterBtn">입장하기</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<header>
  <h1>📋 생기부 분석 모임 협업 보드 <span id="roleBadge" style="font-size:12px; font-weight:700; padding:3px 10px; border-radius:10px; vertical-align:middle; margin-left:6px;"></span></h1>
  <p class="subtitle">학생별 페이지에서 생기부 영역별 메모를 올리고, 자유롭게 의견을 나누는 공간입니다.</p>
  <div class="legend" style="margin-top:8px;">
    <span style="font-size:11px; font-weight:700; color:rgba(0,0,0,0.5); margin-right:4px;">영역별 색:</span>
    <span class="legend-item"><span class="legend-dot" style="background:#FFD6D6"></span>자율활동</span>
    <span class="legend-item"><span class="legend-dot" style="background:#C8E6F0"></span>진로활동</span>
    <span class="legend-item"><span class="legend-dot" style="background:#D4F0D4"></span>동아리활동</span>
    <span class="legend-item"><span class="legend-dot" style="background:#FFDAB8"></span>봉사활동</span>
    <span class="legend-item"><span class="legend-dot" style="background:#FFF4B8"></span>교과세특</span>
    <span class="legend-item"><span class="legend-dot" style="background:#F5E1C8"></span>행동특성</span>
    <span class="legend-item"><span class="legend-dot" style="background:#C8EDE0"></span>성적</span>
    <span class="legend-item"><span class="legend-dot" style="background:#D9D4F0"></span>대학관련정보</span>
    <span class="legend-item"><span class="legend-dot" style="background:#FFFFFF; border:1px solid rgba(0,0,0,0.15)"></span>기타</span>
  </div>
  <div class="legend" style="margin-top:6px;">
    <span style="font-size:11px; font-weight:700; color:rgba(0,0,0,0.5); margin-right:4px;">의견 유형:</span>
    <span class="legend-item">🔍 질문</span>
    <span class="legend-item">💬 해석</span>
    <span class="legend-item">💡 보완</span>
  </div>
</header>

<div class="student-tabs" id="studentTabs"></div>

<div class="toolbar">
  <button class="btn btn-primary" id="addMemoBtn">＋ 새 메모 작성</button>
  <div class="filter-section">
    <label>영역 필터:</label>
    <select id="filterCategory">
      <option value="all">전체</option>
      <option value="자율활동">자율활동</option>
      <option value="진로활동">진로활동</option>
      <option value="동아리활동">동아리활동</option>
      <option value="봉사활동">봉사활동</option>
      <option value="교과세특">교과세특</option>
      <option value="행동특성">행동특성 및 종합의견</option>
      <option value="성적">성적</option>
      <option value="대학관련정보">대학관련 정보</option>
      <option value="기타">기타</option>
    </select>
  </div>
</div>

<div class="board" id="board"></div>

<div class="conn-status" id="connStatus">
  <span class="conn-dot" id="connDot"></span>
  <span id="connText">연결 중...</span>
</div>

<div class="img-lightbox" id="imgLightbox"><img id="imgLightboxImg" src="" alt="확대 이미지"></div>

<!-- 메모 작성 모달 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modalTitle">새 메모 작성</h2>
    <div class="form-group">
      <label>작성자</label>
      <input type="text" id="inputAuthor" placeholder="성함을 입력하세요 (예: 김ㅇㅇ 선생님)">
    </div>
    <div class="form-group">
      <label>영역 <span style="font-weight:400; color:#9aa7b4;">(영역에 따라 색이 자동 지정됩니다)</span></label>
      <select id="inputCategory">
        <option value="자율활동">자율활동</option>
        <option value="진로활동">진로활동</option>
        <option value="동아리활동">동아리활동</option>
        <option value="봉사활동">봉사활동</option>
        <option value="교과세특">교과세특</option>
        <option value="행동특성">행동특성 및 종합의견</option>
        <option value="성적">성적</option>
        <option value="대학관련정보">대학관련 정보</option>
        <option value="기타">기타</option>
      </select>
      <div style="margin-top:8px; display:flex; align-items:center; gap:8px; font-size:12px; color:#6c7a89;">
        <span id="modalColorSwatch" style="width:18px; height:18px; border-radius:50%; display:inline-block; border:1px solid rgba(0,0,0,0.15);"></span>
        <span id="modalColorText">이 영역의 색상</span>
      </div>
    </div>
    <div class="form-group">
      <label>내용</label>
      <textarea id="inputContent" placeholder="생기부를 읽고 발견한 점, 의견, 질문 등을 자유롭게 작성해주세요."></textarea>
    </div>
    <div class="form-group">
      <label>사진 첨부 (선택)</label>
      <div class="img-attach-row">
        <button type="button" class="img-attach-btn" onclick="document.getElementById('inputImageFile').click()">📷 사진 선택</button>
        <input type="file" id="inputImageFile" accept="image/*" style="display:none" onchange="handleMemoImage(event)">
        <div id="inputImagePreview"></div>
      </div>
    </div>
    <div class="form-group">
      <label>PDF 첨부 (선택, 1MB 이하)</label>
      <div class="img-attach-row">
        <button type="button" class="img-attach-btn" onclick="document.getElementById('inputPdfFile').click()">📄 PDF 선택</button>
        <input type="file" id="inputPdfFile" accept="application/pdf" style="display:none" onchange="handleMemoPdf(event)">
        <div id="inputPdfPreview"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" id="submitMemoBtn" onclick="submitMemo()">작성하기</button>
    </div>
  </div>
</div>

<script type="module">

  const firebaseConfig = {

    authDomain: "edu-92632.firebaseapp.com",
    databaseURL: "https://edu-92632-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "edu-92632",
    storageBucket: "edu-92632.firebasestorage.app",
    messagingSenderId: "897016569304",
    appId: "1:897016569304:web:772fe75213421962c9e6ad",
    measurementId: "G-7YX0GQ6WPC"
  };
  const BOARD_PASSWORD = "myys1903";    // 일반 (모든 선생님) — 글 작성 가능
  const ADMIN_PASSWORD = "admin2026";   // 관리자 (선생님·부장님) — 삭제·학생관리 가능

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const studentsRef = ref(db, 'students');

  const CATEGORY_COLORS = { '자율활동':'#FFD6D6','진로활동':'#C8E6F0','동아리활동':'#D4F0D4','봉사활동':'#FFDAB8','교과세특':'#FFF4B8','독서활동':'#E0D4F0','행동특성':'#F5E1C8','성적':'#C8EDE0','대학관련정보':'#D9D4F0','기타':'#FFFFFF' };
  function categoryColor(cat) { return CATEGORY_COLORS[cat] || '#FFFFFF'; }
  // 영역색을 흰색과 섞어 연하게 (댓글용). ratio=0.5면 흰색 50% 섞임
  function lightenColor(hex, ratio) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    const lr = Math.round(r + (255-r)*ratio), lg = Math.round(g + (255-g)*ratio), lb = Math.round(b + (255-b)*ratio);
    return `rgb(${lr}, ${lg}, ${lb})`;
  }
  const TAGS = { question:{label:'🔍 질문',class:'tag-question'}, interpret:{label:'💬 해석',class:'tag-interpret'}, suggest:{label:'💡 보완',class:'tag-suggest'} };
  const LEGACY_TAGS = { concern:{label:'⚠️ 우려',class:'tag-concern'}, agree:{label:'✅ 동의',class:'tag-agree'} };
  function getTag(k){ return TAGS[k] || LEGACY_TAGS[k] || TAGS.question; }

  let students = {};
  let currentStudentId = null;
  let editingMemoId = null;
  let modalImageData = null;
  let modalPdf = null;  // {data, name}
  let activeReplyTo = null;      // {memoId, parentId}  parentId=null이면 메모에 직접 댓글
  let activeEditComment = null;  // {memoId, commentId}
  let formState = {};
  let isAdmin = false;           // 관리자 여부 (삭제·학생관리 권한)

  /* 비밀번호 */
  function checkPassword() {
    const v = document.getElementById('passwordInput').value;
    if (v === ADMIN_PASSWORD) {
      isAdmin = true;
      sessionStorage.setItem('board_unlocked','1');
      sessionStorage.setItem('board_admin','1');
      document.getElementById('lockScreen').style.display='none';
      renderTabs(); renderBoard();
    } else if (v === BOARD_PASSWORD) {
      isAdmin = false;
      sessionStorage.setItem('board_unlocked','1');
      sessionStorage.removeItem('board_admin');
      document.getElementById('lockScreen').style.display='none';
      renderTabs(); renderBoard();
    } else {
      document.getElementById('lockError').textContent='비밀번호가 올바르지 않습니다.';
      document.getElementById('passwordInput').value='';
    }
  }
  document.getElementById('enterBtn').addEventListener('click', checkPassword);
  document.getElementById('passwordInput').addEventListener('keydown', e=>{ if(e.key==='Enter') checkPassword(); });
  if (sessionStorage.getItem('board_unlocked')==='1') {
    isAdmin = sessionStorage.getItem('board_admin')==='1';
    document.getElementById('lockScreen').style.display='none';
  } else {
    document.getElementById('passwordInput').focus();
  }

  /* Firebase 구독 */
  onValue(studentsRef, (snap)=>{
    students = snap.val() || {};
    setConn(true);
    const ids = Object.keys(students);
    if (!currentStudentId || !students[currentStudentId]) {
      currentStudentId = ids.length ? ids.sort((a,b)=>students[b].createdAt-students[a].createdAt)[0] : null;
    }
    renderTabs(); renderBoard();
  }, (e)=>{ console.error(e); setConn(false); });

  function setConn(on){ const d=document.getElementById('connDot'),t=document.getElementById('connText'); if(on){d.className='conn-dot online';t.textContent='실시간 연결됨';}else{d.className='conn-dot offline';t.textContent='연결 끊김 (새로고침 해보세요)';} }

  /* 학생 탭 */
  function renderTabs(){
    const wrap = document.getElementById('studentTabs');
    const ids = Object.keys(students).sort((a,b)=>students[b].createdAt-students[a].createdAt);
    let html = ids.map(id=>`
      <button class="student-tab ${id===currentStudentId?'active':''}" onclick="selectStudent('${id}')">
        ${escapeHtml(students[id].name||'이름없음')}
        ${isAdmin ? `<span class="tab-del" onclick="event.stopPropagation(); deleteStudent('${id}')" title="이 학생 페이지 삭제">✕</span>` : ''}
      </button>`).join('');
    if (isAdmin) html += `<button class="add-student-btn" onclick="addStudent()">＋ 새 학생 추가</button>`;
    wrap.innerHTML = html;
  }
  window.selectStudent = function(id){ currentStudentId=id; activeReplyTo=null; activeEditComment=null; renderTabs(); renderBoard(); };
  window.addStudent = function(){
    if(!isAdmin){ alert('학생 페이지 추가는 관리자만 가능합니다.'); return; }
    const name = prompt('새 학생의 이름(또는 구분명)을 입력하세요.\n예: 김ㅇㅇ, 1반 3번 등');
    if (name===null) return;
    const t = name.trim(); if(!t){ alert('이름을 입력해주세요.'); return; }
    const r = push(studentsRef);
    set(r, { name:t, createdAt:Date.now(), memos:{} }).then(()=>{ currentStudentId=r.key; renderTabs(); renderBoard(); });
  };
  window.deleteStudent = function(id){
    if(!isAdmin){ alert('학생 페이지 삭제는 관리자만 가능합니다.'); return; }
    const name = students[id]?(students[id].name||'이 학생'):'이 학생';
    if(!confirm(`'${name}' 페이지를 삭제하시겠습니까?\n이 학생의 모든 메모가 함께 삭제됩니다.`)) return;
    remove(ref(db,`students/${id}`));
  };

  function currentMemos(){ if(!currentStudentId||!students[currentStudentId]) return {}; return students[currentStudentId].memos||{}; }

  function captureFormInputs(){
    document.querySelectorAll('[data-form-id]').forEach(form=>{
      const fid=form.dataset.formId; if(!formState[fid])formState[fid]={};
      form.querySelectorAll('input[data-field],textarea[data-field]').forEach(el=>{ formState[fid][el.dataset.field]=el.value; });
    });
  }

  /* 보드 렌더 */
  function renderBoard(){
    captureFormInputs();
    // 권한 배지 갱신
    const badge = document.getElementById('roleBadge');
    if (badge) {
      if (isAdmin) { badge.textContent='관리자 모드'; badge.style.background='#5a8bbf'; badge.style.color='white'; }
      else { badge.textContent='작성 모드'; badge.style.background='rgba(0,0,0,0.1)'; badge.style.color='rgba(0,0,0,0.6)'; }
    }
    const board = document.getElementById('board');
    if(!currentStudentId){
      const msg = isAdmin ? '위의 "＋ 새 학생 추가"를 눌러 첫 학생 페이지를 만들어보세요.' : '아직 학생 페이지가 없습니다. 관리자에게 학생 페이지 생성을 요청해주세요.';
      board.innerHTML=`<div class="empty-state"><h3>학생 페이지가 없습니다</h3><p>${msg}</p></div>`;
      return;
    }

    const memosObj = currentMemos();
    const memos = Object.keys(memosObj).map(id=>({id,...memosObj[id]}));
    const filter = document.getElementById('filterCategory').value;
    let shown = filter==='all'?memos:memos.filter(m=>m.category===filter);
    shown.sort((a,b)=>b.createdAt-a.createdAt);

    if(shown.length===0){ board.innerHTML=`<div class="empty-state"><h3>아직 메모가 없습니다</h3><p>"＋ 새 메모 작성"으로 이 학생의 첫 메모를 올려보세요.</p></div>`; return; }

    board.innerHTML = shown.map(memo=>renderMemoGroup(memo)).join('');
    bindFormListeners();
  }

  function renderMemoGroup(memo){
    const commentsObj = memo.comments || {};
    const comments = Object.keys(commentsObj).map(id=>({id,...commentsObj[id],parentId:commentsObj[id].parentId||null}));
    const topComments = comments.filter(c=>!c.parentId).sort((a,b)=>a.createdAt-b.createdAt);
    const memoCat = memo.category || '기타';
    const commentsHtml = topComments.map(c=>renderComment(memo.id, c, comments, 0, memoCat)).join('');

    // 메모에 직접 댓글 다는 영역: 버튼 또는 폼
    const replyingToMemo = activeReplyTo && activeReplyTo.memoId===memo.id && activeReplyTo.parentId===null;
    const addArea = replyingToMemo
      ? renderCommentForm(memo.id, null)
      : `<button class="add-comment-btn" onclick="startReply('${memo.id}', null)">＋ 의견 달기</button>`;

    // 댓글이 하나라도 있으면 연결선 컨테이너로 감쌈
    const commentsBlock = topComments.length > 0
      ? `<div class="comments-wrap">${commentsHtml}</div>`
      : '';

    return `<div class="memo-group">${renderMemo(memo)}${commentsBlock}${addArea}</div>`;
  }

  function renderMemo(memo){
    const bg = memo.category ? categoryColor(memo.category) : '#FFFFFF';
    return `
      <div class="memo" style="background:${bg}">
        <div class="memo-header">
          <div class="memo-meta">
            <span class="memo-author">${escapeHtml(memo.author||'익명')}</span>
            <span class="memo-time"> · ${formatDate(memo.createdAt)}${memo.editedAt?' (수정됨)':''}</span>
          </div>
          <div class="actions">
            <button class="icon-btn" onclick="editMemo('${memo.id}')" title="수정">✎</button>
            ${isAdmin ? `<button class="icon-btn" onclick="deleteMemo('${memo.id}')" title="삭제">✕</button>` : ''}
          </div>
        </div>
        <div class="cat-badge">${escapeHtml(memo.category||'기타')}</div>
        <div class="memo-content">${escapeHtml(memo.content)}</div>
        ${memo.image?`<div class="memo-image"><img src="${memo.image}" onclick="openLightbox('${memo.image}')" alt="첨부 사진"></div>`:''}
        ${memo.pdf?`<div class="pdf-attach"><a class="pdf-link" href="${memo.pdf}" download="${escapeHtml(memo.pdfName||'첨부.pdf')}" target="_blank" rel="noopener">📄 ${escapeHtml(memo.pdfName||'PDF 첨부파일')}</a></div>`:''}
      </div>`;
  }

  function renderComment(memoId, comment, allComments, depth, memoCat){
    const isEditing = activeEditComment && activeEditComment.memoId===memoId && activeEditComment.commentId===comment.id;
    if(isEditing) return renderCommentForm(memoId, comment.parentId, comment);

    const tag = getTag(comment.tag);
    const replies = allComments.filter(c=>c.parentId===comment.id).sort((a,b)=>a.createdAt-b.createdAt);
    const replyClass = depth>0?'reply':'';
    const replyingHere = activeReplyTo && activeReplyTo.memoId===memoId && activeReplyTo.parentId===comment.id;
    // 댓글 배경: 메모 영역색을 연하게 (배경과 구분되도록)
    const commentBg = lightenColor(categoryColor(memoCat), 0.55);
    // 깊이에 비례한 들여쓰기 (한 단계당 20px씩 안쪽으로)
    const indent = depth * 20;
    const indentStyle = depth > 0 ? `margin-left:${indent}px;` : '';

    return `
      <div class="comment ${replyClass}" style="background:${commentBg};${indentStyle}">
        <div class="comment-header">
          <div class="comment-meta">
            <span class="tag-badge ${tag.class}">${tag.label}</span>
            <span class="comment-author">${escapeHtml(comment.author||'익명')}</span>
            <span class="comment-time">${formatDate(comment.createdAt)}${comment.editedAt?' ·수정':''}</span>
          </div>
          <div class="actions">
            <button class="icon-btn" onclick="startEditComment('${memoId}','${comment.id}')" title="수정">✎</button>
            ${isAdmin ? `<button class="icon-btn" onclick="deleteComment('${memoId}','${comment.id}')" title="삭제">✕</button>` : ''}
          </div>
        </div>
        <div class="comment-content">${escapeHtml(comment.text)}</div>
        ${comment.image?`<div class="comment-image"><img src="${comment.image}" onclick="openLightbox('${comment.image}')" alt="첨부 사진"></div>`:''}
        ${comment.pdf?`<div class="pdf-attach"><a class="pdf-link" href="${comment.pdf}" download="${escapeHtml(comment.pdfName||'첨부.pdf')}" target="_blank" rel="noopener">📄 ${escapeHtml(comment.pdfName||'PDF 첨부파일')}</a></div>`:''}
        <button class="reply-btn" onclick="startReply('${memoId}','${comment.id}')">💬 답글 달기</button>
      </div>
      ${replyingHere ? renderCommentForm(memoId, comment.id, null, depth + 1) : ''}
      ${replies.map(r=>renderComment(memoId, r, allComments, depth+1, memoCat)).join('')}`;
  }

  function renderCommentForm(memoId, parentId, editingComment, depth){
    const isEdit = !!editingComment;
    const fid = isEdit ? `editform-${memoId}-${editingComment.id}` : `form-${memoId}-${parentId||'memo'}`;
    const isReply = parentId!==null && parentId!==undefined;
    const saved = formState[fid] || (isEdit ? { author:editingComment.author, text:editingComment.text, tag:editingComment.tag, image:editingComment.image||null, pdf:editingComment.pdf||null, pdfName:editingComment.pdfName||null } : {});
    if(!formState[fid]) formState[fid]=saved;
    const imgPreview = saved.image ? `<div class="img-preview-wrap"><img src="${saved.image}"><button type="button" class="img-remove-btn" onclick="removeFormImage('${fid}')">✕</button></div>` : '';
    const pdfPreview = saved.pdf ? `<span class="pdf-preview-name">📄 ${escapeHtml(saved.pdfName||'첨부.pdf')} <button type="button" class="pdf-remove" onclick="removeFormPdf('${fid}')">✕</button></span>` : '';
    const tagOptions = Object.entries(TAGS).map(([k,t])=>`<button class="tag-btn ${saved.tag===k?'active':''}" data-tag="${k}" onclick="selectFormTag('${fid}','${k}')">${t.label}</button>`).join('');
    // 답글 입력칸: 깊이에 비례한 들여쓰기 (한 단계당 20px, 단 reply-form 기본 16px과 겹치므로 깊이 1 이상부터 적용)
    const formIndent = (depth && depth > 0) ? `margin-left:${depth * 20}px;` : '';

    return `
      <div class="comment-form ${isReply?'reply-form':''}" data-form-id="${fid}" style="${formIndent}">
        <div class="form-row-top">
          <input class="author-input" type="text" placeholder="작성자명" data-field="author" value="${escapeHtml(saved.author||'')}">
          <div class="tag-selector">${tagOptions}</div>
        </div>
        <textarea data-field="text" placeholder="${isReply?'답글을 입력하세요...':'의견을 입력하세요.'}">${escapeHtml(saved.text||'')}</textarea>
        <div class="img-attach-row">
          <button type="button" class="img-attach-btn" onclick="this.parentNode.querySelector('input[type=file]').click()">📷 사진</button>
          <input type="file" accept="image/*" style="display:none" onchange="handleFormImage('${fid}', event)">
          ${imgPreview}
        </div>
        <div class="img-attach-row">
          <button type="button" class="img-attach-btn" onclick="this.parentNode.querySelector('input[type=file]').click()">📄 PDF</button>
          <input type="file" accept="application/pdf" style="display:none" onchange="handleFormPdf('${fid}', event)">
          ${pdfPreview}
        </div>
        <div class="form-row-bottom">
          <span class="form-hint">${isEdit?'수정 중':'유형 태그를 선택해주세요'}</span>
          <div class="form-buttons">
            <button class="cancel-btn" onclick="${isEdit?'cancelEditComment()':'cancelReply()'}">취소</button>
            <button class="submit-btn" onclick="${isEdit?`submitEditComment('${memoId}','${editingComment.id}','${fid}')`:`submitComment('${memoId}',${parentId?`'${parentId}'`:'null'},'${fid}')`}">${isEdit?'수정 완료':'등록'}</button>
          </div>
        </div>
      </div>`;
  }

  function bindFormListeners(){
    document.querySelectorAll('[data-form-id]').forEach(form=>{
      const fid=form.dataset.formId;
      form.querySelectorAll('input[data-field],textarea[data-field]').forEach(el=>{
        el.addEventListener('input',()=>{ if(!formState[fid])formState[fid]={}; formState[fid][el.dataset.field]=el.value; });
      });
    });
  }

  window.selectFormTag = function(fid, tag){
    captureFormInputs(); if(!formState[fid])formState[fid]={}; formState[fid].tag=tag;
    const form=document.querySelector(`[data-form-id="${fid}"]`);
    if(form) form.querySelectorAll('.tag-btn').forEach(b=>b.classList.toggle('active', b.dataset.tag===tag));
  };

  /* 댓글 작성 흐름 */
  window.startReply = function(memoId, parentId){ captureFormInputs(); activeReplyTo={memoId, parentId:parentId||null}; activeEditComment=null; renderBoard(); };
  window.cancelReply = function(){ if(activeReplyTo){ const fid=`form-${activeReplyTo.memoId}-${activeReplyTo.parentId||'memo'}`; delete formState[fid]; } activeReplyTo=null; renderBoard(); };
  window.startEditComment = function(memoId, commentId){ captureFormInputs(); activeEditComment={memoId, commentId}; renderBoard(); };
  window.cancelEditComment = function(){ if(activeEditComment){ delete formState[`editform-${activeEditComment.memoId}-${activeEditComment.commentId}`]; } activeEditComment=null; renderBoard(); };

  /* 사진 압축 */
  function compressImage(file, maxSize, quality){
    return new Promise((resolve,reject)=>{
      if(!file.type.startsWith('image/')){ reject(new Error('이미지 파일이 아닙니다.')); return; }
      const reader=new FileReader();
      reader.onload=e=>{ const img=new Image();
        img.onload=()=>{ let{width,height}=img;
          if(width>height&&width>maxSize){height=Math.round(height*maxSize/width);width=maxSize;}
          else if(height>maxSize){width=Math.round(width*maxSize/height);height=maxSize;}
          const c=document.createElement('canvas');c.width=width;c.height=height;c.getContext('2d').drawImage(img,0,0,width,height);
          let r=c.toDataURL('image/jpeg',quality),q=quality;
          while(r.length>700000&&q>0.3){q-=0.15;r=c.toDataURL('image/jpeg',q);}
          resolve(r);
        };
        img.onerror=()=>reject(new Error('이미지를 불러올 수 없습니다.')); img.src=e.target.result;
      };
      reader.onerror=()=>reject(new Error('파일을 읽을 수 없습니다.')); reader.readAsDataURL(file);
    });
  }

  // PDF를 data URL로 읽기 (용량 제한 약 1MB)
  const PDF_MAX_BYTES = 1024 * 1024; // 1MB
  function readPdf(file){
    return new Promise((resolve,reject)=>{
      if(file.type !== 'application/pdf'){ reject(new Error('PDF 파일이 아닙니다.')); return; }
      if(file.size > PDF_MAX_BYTES){ reject(new Error('PDF 용량이 너무 큽니다. 1MB 이하의 가벼운 PDF만 첨부할 수 있어요.')); return; }
      const reader=new FileReader();
      reader.onload=e=>resolve({ data:e.target.result, name:file.name });
      reader.onerror=()=>reject(new Error('파일을 읽을 수 없습니다.'));
      reader.readAsDataURL(file);
    });
  }
  window.handleFormImage = async function(fid, event){
    const file=event.target.files[0]; if(!file)return; captureFormInputs();
    try{ const data=await compressImage(file,1000,0.7); if(!formState[fid])formState[fid]={}; formState[fid].image=data; renderBoard(); }
    catch(err){ alert('사진 처리 실패: '+err.message); }
    event.target.value='';
  };
  window.removeFormImage = function(fid){ captureFormInputs(); if(formState[fid])formState[fid].image=null; renderBoard(); };
  window.handleFormPdf = async function(fid, event){
    const file=event.target.files[0]; if(!file)return; captureFormInputs();
    try{ const r=await readPdf(file); if(!formState[fid])formState[fid]={}; formState[fid].pdf=r.data; formState[fid].pdfName=r.name; renderBoard(); }
    catch(err){ alert(err.message); }
    event.target.value='';
  };
  window.removeFormPdf = function(fid){ captureFormInputs(); if(formState[fid]){ formState[fid].pdf=null; formState[fid].pdfName=null; } renderBoard(); };
  window.openLightbox = function(src){ document.getElementById('imgLightboxImg').src=src; document.getElementById('imgLightbox').classList.add('active'); };
  document.getElementById('imgLightbox').addEventListener('click',function(){ this.classList.remove('active'); });

  /* 댓글 저장 */
  window.submitComment = function(memoId, parentId, fid){
    captureFormInputs(); const s=formState[fid]||{};
    const hasText=s.text&&s.text.trim();
    if(!hasText&&!s.image&&!s.pdf){ alert('내용을 입력하거나 사진/PDF를 첨부해주세요.'); return; }
    if(!s.tag){ alert('유형 태그를 선택해주세요. (질문/해석/보완 중 하나)'); return; }
    const cRef=push(ref(db,`students/${currentStudentId}/memos/${memoId}/comments`));
    set(cRef, { author:(s.author||'').trim(), text:hasText?s.text.trim():'', tag:s.tag, image:s.image||null, pdf:s.pdf||null, pdfName:s.pdfName||null, parentId:parentId, createdAt:Date.now() });
    delete formState[fid]; activeReplyTo=null; renderBoard();
  };
  window.submitEditComment = function(memoId, commentId, fid){
    captureFormInputs(); const s=formState[fid]||{};
    const hasText=s.text&&s.text.trim();
    if(!hasText&&!s.image&&!s.pdf){ alert('내용을 입력하거나 사진/PDF를 첨부해주세요.'); return; }
    const u={ author:(s.author||'').trim(), text:hasText?s.text.trim():'', image:s.image||null, pdf:s.pdf||null, pdfName:s.pdfName||null, editedAt:Date.now() };
    if(s.tag)u.tag=s.tag;
    update(ref(db,`students/${currentStudentId}/memos/${memoId}/comments/${commentId}`), u);
    delete formState[fid]; activeEditComment=null; renderBoard();
  };
  window.deleteComment = async function(memoId, commentId){
    if(!isAdmin){ alert('삭제는 관리자만 가능합니다.'); return; }
    if(!confirm('이 의견을 삭제하시겠습니까? 답글도 함께 삭제됩니다.')) return;
    const memo=currentMemos()[memoId]; if(!memo) return;
    const cObj=memo.comments||{};
    const toDel=new Set([commentId]); let ch=true;
    while(ch){ ch=false; Object.keys(cObj).forEach(id=>{ const p=cObj[id].parentId; if(p&&toDel.has(p)&&!toDel.has(id)){toDel.add(id);ch=true;} }); }
    for(const id of toDel) await remove(ref(db,`students/${currentStudentId}/memos/${memoId}/comments/${id}`));
  };

  /* 메모 모달 */
  window.updateModalColorHint = function(){
    const cat=document.getElementById('inputCategory').value, color=categoryColor(cat);
    document.getElementById('modalColorSwatch').style.background=color;
    document.getElementById('modalColorText').textContent=`${cat} 영역 색상`;
  };
  document.getElementById('inputCategory').addEventListener('change', window.updateModalColorHint);

  window.handleMemoImage = async function(event){
    const file=event.target.files[0]; if(!file)return;
    try{ modalImageData=await compressImage(file,1000,0.7); renderMemoImagePreview(); }
    catch(err){ alert('사진 처리 실패: '+err.message); }
    event.target.value='';
  };
  function renderMemoImagePreview(){
    const w=document.getElementById('inputImagePreview');
    w.innerHTML = modalImageData ? `<div class="img-preview-wrap"><img src="${modalImageData}"><button type="button" class="img-remove-btn" onclick="removeMemoImage()">✕</button></div>` : '';
  }
  window.removeMemoImage = function(){ modalImageData=null; renderMemoImagePreview(); };

  window.handleMemoPdf = async function(event){
    const file=event.target.files[0]; if(!file)return;
    try{ modalPdf=await readPdf(file); renderMemoPdfPreview(); }
    catch(err){ alert(err.message); }
    event.target.value='';
  };
  function renderMemoPdfPreview(){
    const w=document.getElementById('inputPdfPreview');
    w.innerHTML = modalPdf ? `<span class="pdf-preview-name">📄 ${escapeHtml(modalPdf.name)} <button type="button" class="pdf-remove" onclick="removeMemoPdf()">✕</button></span>` : '';
  }
  window.removeMemoPdf = function(){ modalPdf=null; renderMemoPdfPreview(); };

  window.openModal = function(){
    if(!currentStudentId){ alert('먼저 "＋ 새 학생 추가"로 학생 페이지를 만들어주세요.'); return; }
    editingMemoId=null; modalImageData=null; modalPdf=null;
    document.getElementById('modalTitle').textContent='새 메모 작성';
    document.getElementById('submitMemoBtn').textContent='작성하기';
    document.getElementById('inputAuthor').value='';
    document.getElementById('inputCategory').value='자율활동';
    document.getElementById('inputContent').value='';
    renderMemoImagePreview(); renderMemoPdfPreview(); updateModalColorHint();
    document.getElementById('modal').classList.add('active');
  };
  window.editMemo = function(memoId){
    const memo=currentMemos()[memoId]; if(!memo)return;
    editingMemoId=memoId; modalImageData=memo.image||null;
    modalPdf = memo.pdf ? { data:memo.pdf, name:memo.pdfName||'첨부.pdf' } : null;
    document.getElementById('modalTitle').textContent='메모 수정';
    document.getElementById('submitMemoBtn').textContent='수정 완료';
    document.getElementById('inputAuthor').value=memo.author||'';
    document.getElementById('inputCategory').value=memo.category||'자율활동';
    document.getElementById('inputContent').value=memo.content||'';
    renderMemoImagePreview(); renderMemoPdfPreview(); updateModalColorHint();
    document.getElementById('modal').classList.add('active');
  };
  window.closeModal = function(){ document.getElementById('modal').classList.remove('active'); editingMemoId=null; modalImageData=null; modalPdf=null; };
  window.submitMemo = function(){
    const author=document.getElementById('inputAuthor').value.trim();
    const category=document.getElementById('inputCategory').value;
    const content=document.getElementById('inputContent').value.trim();
    if(!content&&!modalImageData&&!modalPdf){ alert('내용을 입력하거나 사진/PDF를 첨부해주세요.'); return; }
    const color=categoryColor(category);
    const base = { author, category, content, color, image:modalImageData||null, pdf:modalPdf?modalPdf.data:null, pdfName:modalPdf?modalPdf.name:null };
    if(editingMemoId){
      update(ref(db,`students/${currentStudentId}/memos/${editingMemoId}`), { ...base, editedAt:Date.now() });
    } else {
      const r=push(ref(db,`students/${currentStudentId}/memos`));
      set(r, { ...base, createdAt:Date.now(), comments:{} });
    }
    closeModal();
  };
  window.deleteMemo = function(memoId){
    if(!isAdmin){ alert('삭제는 관리자만 가능합니다.'); return; }
    if(!confirm('이 메모를 삭제하시겠습니까? 모든 의견도 함께 삭제됩니다.')) return;
    remove(ref(db,`students/${currentStudentId}/memos/${memoId}`));
  };

  document.getElementById('addMemoBtn').addEventListener('click', ()=>window.openModal());
  document.getElementById('modal').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
  document.getElementById('filterCategory').addEventListener('change', renderBoard);

  function escapeHtml(t){ if(!t&&t!=='')return ''; const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
  function formatDate(ts){ const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`; }
</script>

</body>
</html>
